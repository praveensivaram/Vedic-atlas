name: get_weather_forecast
agent: lookup
description: Forecast for a place 0-6 days ahead (0 today, 1 tomorrow); also for umbrella or coat questions. Empty place means home.
reply_mode: template        # the sentence is built from the provider's numbers; it names the place and the day
permission_level: auto
requires_online: true
allow_advice: true          # the model may ask for a reasoned answer ("umbrella?") instead of the readout
cache_ttl_sec: 1800
hosts: [api.open-meteo.com, geocoding-api.open-meteo.com]

params:
  place:
    type: string
    format: latin          # transliterate the user's script before geocoding
    description: city or place name; empty means home
  date_offset:
    type: integer
    required: true
    description: days from today, 0 to 6 (0 today, 1 tomorrow, 2 day after tomorrow)

examples:
  - user: will it rain tomorrow in Pune
    calls: [{tool: get_weather_forecast, args: {place: Pune, date_offset: 1}}]
  - user: how will the weather be the day after tomorrow in Goa
    calls: [{tool: get_weather_forecast, args: {place: Goa, date_offset: 2}}]

